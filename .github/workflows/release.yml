name: Gerar EPUB

# Ao publicar uma release, empacota OEBPS/ em um EPUB e o anexa à release.
# Não traduz nada: o conteúdo (corrigível à mão) é o que está em OEBPS/.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # o nome do EPUB leva a versão da release (a tag); em execução manual, a ref
  EPUB: spl-ptBR-${{ github.event.release.tag_name || github.ref_name }}.epub

jobs:
  epub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empacotar OEBPS/ em EPUB
        run: |
          python3 - <<'PY'
          import os, zipfile
          CONTAINER = ('<?xml version="1.0"?>\n<container version="1.0" '
                       'xmlns="urn:oasis:names:tc:opendocument:xmlns:container">'
                       '<rootfiles><rootfile full-path="OEBPS/content.opf" '
                       'media-type="application/oebps-package+xml"/></rootfiles></container>')
          with zipfile.ZipFile(os.environ["EPUB"], "w") as z:
              # mimetype: 1º item e sem compressão (spec OCF)
              z.writestr("mimetype", "application/epub+zip",
                         compress_type=zipfile.ZIP_STORED)
              z.writestr("META-INF/container.xml", CONTAINER,
                         compress_type=zipfile.ZIP_DEFLATED)
              for raiz, _, arqs in sorted(os.walk("OEBPS")):
                  for a in sorted(arqs):
                      p = os.path.join(raiz, a)
                      z.write(p, p, compress_type=zipfile.ZIP_DEFLATED)
          PY

      - name: Conferir o XML
        run: |
          python3 - <<'PY'
          import os, zipfile, xml.dom.minidom as M
          z = zipfile.ZipFile(os.environ["EPUB"])
          ruins = []
          for n in z.namelist():
              if n.endswith((".xhtml", ".opf", ".xml")):
                  try: M.parseString(z.read(n))
                  except Exception: ruins.append(n)
          assert not ruins, f"XML inválido: {ruins}"
          print("XML ok:", len(z.namelist()), "arquivos")
          PY

      - name: Anexar à release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$EPUB" --clobber

      - name: Guardar como artefato (execução manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EPUB }}
          path: ${{ env.EPUB }}
