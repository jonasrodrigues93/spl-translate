name: Gerar EPUB

# Ao publicar uma release, monta o EPUB a partir da tradução versionada em
# traducao/livro.jsonl e o anexa à própria release. Não chama nenhum LLM.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # PDF de origem. Os índices de bloco só casam com ESTE arquivo: se o hash
  # não bater, a montagem para em vez de gerar um livro embaralhado.
  PDF_SHA256: 88d0362c3bcb62a0cd09403fb80fd15e778dd53566943912ab1047cda3ff5c79
  ED3BOOK_PDF: ${{ github.workspace }}/ed3book.pdf
  # nome do EPUB leva a versão da release (a tag); em execução manual, o nome da ref
  EPUB: spl-ptBR-${{ github.event.release.tag_name || github.ref_name }}.epub

jobs:
  epub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-freefont-ttf fonts-noto-cjk fonts-dejavu-core python3-fonttools
          pip install -r requirements.txt

      - name: Baixar o PDF de origem
        run: |
          test -n "${{ vars.PDF_URL }}" || { echo "defina a variável de repositório PDF_URL"; exit 1; }
          curl -fL "${{ vars.PDF_URL }}" -o "$ED3BOOK_PDF"
          echo "$PDF_SHA256  $ED3BOOK_PDF" | sha256sum -c -

      - name: Extrair, citações, fontes e capa
        run: |
          python extract.py
          python bib.py
          /usr/bin/python3 fonts.py      # Python do sistema: o fontTools está lá
          python capa.py

      - name: Montar o EPUB
        run: python build_epub.py --jsonl "$GITHUB_WORKSPACE/traducao/livro.jsonl" --sem-links --out "$EPUB"

      - name: Conferir o XML
        run: |
          python - <<'PY'
          import os, zipfile, xml.dom.minidom as M
          z = zipfile.ZipFile("build/" + os.environ["EPUB"])
          ruins = []
          for n in z.namelist():
              if n.endswith((".xhtml", ".opf", ".xml")):
                  try: M.parseString(z.read(n))
                  except Exception: ruins.append(n)
          assert not ruins, f"XML inválido: {ruins}"
          print("XML ok:", len(z.namelist()), "arquivos")
          PY

      - name: Anexar à release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "build/$EPUB" --clobber

      - name: Guardar como artefato (execução manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EPUB }}
          path: build/${{ env.EPUB }}
